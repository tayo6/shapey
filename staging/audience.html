<!doctype html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1a0e">
  <title>Shapey — Live Games</title>
  <link rel="icon" type="image/webp" href="assets/ui/shapey%20icon.webp">
  <link rel="preload" href="assets/fonts/HAPPY%20SCHOOL.TTF" as="font" type="font/ttf" crossorigin>
  <style>
    /* Everything is laid out in the game's own 720 x 1280 units (--u = one game pixel), so this page
       scales exactly like the game canvas and uses the same art, font, colours and wood buttons. */
    @font-face { font-family: HappySchool; src: url("assets/fonts/HAPPY%20SCHOOL.TTF") format("truetype"); font-display: swap; }
    :root { --gold:#d5ad72; --cream:#fff2c7; --sand:#ffe9b8; --wood:#754322; --panel:#4b2d17; --ink:#3a2412; --dark:#25180f; --cyan:#66e0ff; --star:#ffe36e; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; min-height:100%; background:#2a1a0e; }
    body { background:#2a1a0e url("assets/backgrounds/BG.webp") center / cover fixed; color:#fff; font-family:HappySchool, system-ui, sans-serif; overflow-x:hidden; }
    [hidden] { display:none !important; }
    button { font:inherit; color:inherit; border:0; padding:0; background:none; cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline:3px solid var(--cyan); outline-offset:2px; }

    /* Game text: white with a dark brown outline, like the Phaser text objects. */
    .gt { color:#fff; font-size:calc(var(--u) * var(--fs, 24)); -webkit-text-stroke:calc(var(--u) * var(--st, 5)) var(--ink); paint-order:stroke fill; stroke-linejoin:round; line-height:1; white-space:nowrap; }
    .sub { margin:0; color:var(--sand); font-size:max(12px, calc(var(--u) * 21)); line-height:1.35; }

    /* The game's woodButton: flat wood fill, 4px sand border. */
    .wood { display:inline-flex; align-items:center; justify-content:center; text-align:center; background:var(--wood); border:calc(var(--u) * 4) solid #f3d29a; color:#fff;
            font-size:max(13px, calc(var(--u) * var(--fs, 30))); min-height:calc(var(--u) * var(--h, 72)); padding:0 calc(var(--u) * 22);
            -webkit-text-stroke:calc(var(--u) * 5) var(--ink); paint-order:stroke fill; stroke-linejoin:round; transition:transform .07s; }
    .wood:active { transform:scale(.96); }
    .wood.is-active { background:#9a5c2e; border-color:var(--cream); }
    .wood:disabled { opacity:.5; cursor:not-allowed; }

    .at { position:absolute; left:calc(var(--u) * var(--x)); top:calc(var(--u) * var(--y)); width:calc(var(--u) * var(--w)); }
    .c { transform:translate(-50%, -50%); }
    .ct { transform:translateX(-50%); }

    /* ---------------------------------------------------------------- directory */
    .dir { --u:calc(min(100vw, 720px) / 720); position:relative; width:calc(var(--u) * 720); margin:0 auto; min-height:100vh; padding:calc(var(--u) * 240) calc(var(--u) * 28) calc(var(--u) * 200); }
    .dir-head, .dir-nav { position:fixed; left:50%; transform:translateX(-50%); width:calc(var(--u) * 720); z-index:5; }
    .dir-head { top:0; pointer-events:none; }
    .dir-head img { display:block; width:100%; }
    .dir-head .shadow { position:absolute; top:0; left:0; }
    .dir-head .plank { position:relative; }
    .dir-head .logo { position:absolute; left:calc(var(--u) * 22); top:calc(var(--u) * 20); width:calc(var(--u) * 92); }
    .dir-head h1 { position:absolute; left:0; right:0; top:calc(var(--u) * 40); margin:0; text-align:center; }
    .dir-nav { bottom:0; height:calc(var(--u) * 166); }
    .dir-nav img { position:absolute; left:0; bottom:0; width:100%; }
    .dir-nav .wood { position:absolute; top:calc(var(--u) * 52); width:calc(var(--u) * 290); --h:78; }
    .dir-nav .home { left:calc(var(--u) * 58); }
    .dir-nav .refresh { right:calc(var(--u) * 58); }
    .filter-row { display:flex; flex-wrap:wrap; gap:calc(var(--u) * 10); margin-bottom:calc(var(--u) * 12); }
    .filter-row .wood { --h:62; --fs:24; padding:0 calc(var(--u) * 18); flex:1 1 auto; }
    .dir-status { text-align:center; margin:calc(var(--u) * 10) 0 calc(var(--u) * 18); color:var(--cream); font-size:max(13px, calc(var(--u) * 22)); }
    .dir-status.error { color:#ffb09e; }
    .room-list { display:grid; gap:calc(var(--u) * 22); }
    .panel { background:var(--panel); border:calc(var(--u) * 5) solid var(--gold); padding:calc(var(--u) * 22); }
    .room-card { display:grid; gap:calc(var(--u) * 12); text-transform:uppercase; }
    .room-card .top { display:flex; justify-content:space-between; align-items:center; gap:calc(var(--u) * 12); }
    .room-card h3 { margin:0; }
    .tag-pill { padding:calc(var(--u) * 6) calc(var(--u) * 14); background:var(--dark); border:calc(var(--u) * 3) solid var(--gold); color:var(--sand); font-size:max(11px, calc(var(--u) * 20)); }
    .tag-pill.live { color:var(--star); border-color:var(--star); }
    .score-row { display:flex; align-items:center; justify-content:center; gap:calc(var(--u) * 14); }
    .score-row .num { color:var(--star); font-size:max(20px, calc(var(--u) * 46)); -webkit-text-stroke:calc(var(--u) * 8) var(--ink); paint-order:stroke fill; }
    .score-row .side { color:var(--sand); font-size:max(11px, calc(var(--u) * 20)); }
    .room-card .wood { --h:70; width:100%; }
    .notice { background:var(--panel); border:calc(var(--u) * 5) solid var(--gold); padding:calc(var(--u) * 26); text-align:center; color:var(--sand); font-size:max(13px, calc(var(--u) * 24)); line-height:1.4; }

    /* --------------------------------------------------------------- watch stage */
    .stage { --u:calc(min(100vw, 720px) / 720); display:grid; place-items:center; min-height:100vh; }
    @supports (height:1dvh) { .stage { --u:calc(min(100vw, 56.25dvh, 720px) / 720); min-height:100dvh; } }
    .canvas { position:relative; width:calc(var(--u) * 720); height:calc(var(--u) * 1280); overflow:hidden; background:#2a1a0e; }
    .canvas img { display:block; user-select:none; -webkit-user-drag:none; }
    .fill { position:absolute; left:0; width:100%; }
    .team { position:absolute; inset:0; pointer-events:none; transition:opacity .25s; }
    .team.dim { opacity:.55; }
    .team img { position:absolute; left:calc(var(--u) * var(--x)); top:calc(var(--u) * var(--y)); width:calc(var(--u) * var(--w)); height:calc(var(--u) * var(--h)); transform:translateX(-50%); }
    #toast { z-index:15; width:calc(var(--u) * 660); white-space:normal; text-align:center; color:var(--cream); }
    #toast.error { color:#ffb09e; }
    #toast, .veil p { text-transform:uppercase; }
    #board { position:absolute; left:calc(var(--u) * 36); top:calc(var(--u) * 316); width:calc(var(--u) * 648); height:calc(var(--u) * 648); overflow:hidden; }
    .tile { position:absolute; width:calc(var(--u) * 90); height:calc(var(--u) * 90);
            left:calc(var(--u) * (6.5 + 91 * var(--c, 0))); top:calc(var(--u) * (6.5 + 91 * var(--r, 0))); transition:left .35s ease, top .35s ease; }
    .tile img { width:100%; height:100%; }
    /* The same 5px cyan square stroke the game draws around tiles while they shuffle. */
    .tile.is-moving { outline:calc(var(--u) * 5) solid var(--cyan); outline-offset:calc(var(--u) * -0.5); }
    .tile.is-selected { outline:calc(var(--u) * 4) solid var(--star); outline-offset:calc(var(--u) * -1); }
    .veil { position:absolute; left:50%; top:calc(var(--u) * 640); transform:translate(-50%, -50%); width:calc(var(--u) * 560); z-index:12; display:grid; gap:calc(var(--u) * 20); justify-items:center; text-align:center;
            background:rgba(18,10,5,.78); border:calc(var(--u) * 5) solid var(--gold); padding:calc(var(--u) * 30); }
    .veil p { margin:0; white-space:normal; line-height:1.25; }
    .nav-icon { position:absolute; left:calc(var(--u) * var(--x)); top:calc(var(--u) * 1068); height:calc(var(--u) * 146); transform:translateX(-50%); z-index:30; }
    .nav-icon img { height:100%; width:auto; transition:transform .07s, filter .15s; }
    .nav-icon:active img { transform:scale(.93); }
    .nav-icon.is-open img { filter:brightness(1.12) drop-shadow(0 0 calc(var(--u) * 10) var(--star)); }
    .badge { position:absolute; right:calc(var(--u) * -4); top:calc(var(--u) * 2); min-width:calc(var(--u) * 38); height:calc(var(--u) * 38); padding:0 calc(var(--u) * 6); border-radius:999px; background:#ffd45e; border:calc(var(--u) * 3) solid var(--ink); color:var(--ink); display:grid; place-items:center; font-size:max(10px, calc(var(--u) * 22)); }
    .backdrop { position:absolute; inset:0; z-index:19; background:rgba(18,10,5,.78); }

    /* Panels reuse the game's menu panel: 0x4b2d17 fill, 5px 0xd5ad72 border. */
    .sheet { position:absolute; z-index:20; background:var(--panel); border:calc(var(--u) * 5) solid var(--gold); padding:calc(var(--u) * 24); display:flex; flex-direction:column; gap:calc(var(--u) * 16); }
    .sheet-head { display:flex; align-items:center; justify-content:space-between; gap:calc(var(--u) * 12); }
    .sheet-head h2 { margin:0; }
    .sheet .x { --h:60; --fs:30; min-width:calc(var(--u) * 64); padding:0; }
    .chat { left:calc(var(--u) * 30); top:calc(var(--u) * 24); width:calc(var(--u) * 660); height:calc(var(--u) * 1020); }
    .menu { left:calc(var(--u) * 60); top:calc(var(--u) * 200); width:calc(var(--u) * 600); }
    .poll { left:calc(var(--u) * 40); top:calc(var(--u) * 150); width:calc(var(--u) * 640); }
    .menu .wood, .composer .wood { --h:76; }

    /* Chat: a text-only room, like Clubhouse's chat. Avatar, name, time, message. Nothing else. */
    .msgs { flex:1; min-height:0; overflow-y:auto; background:var(--dark); border:calc(var(--u) * 4) solid #8b623a; padding:calc(var(--u) * 16); display:flex; flex-direction:column; gap:calc(var(--u) * 20); }
    .msgs .empty { margin:auto; text-align:center; color:#b79a73; font-size:max(13px, calc(var(--u) * 24)); }
    .msg { display:flex; gap:calc(var(--u) * 14); align-items:flex-start; }
    .avatar { flex:none; width:calc(var(--u) * 66); height:calc(var(--u) * 66); border-radius:50%; border:calc(var(--u) * 3) solid #f3d29a; background:var(--bg, #754322); display:grid; place-items:center; font-size:max(14px, calc(var(--u) * 30)); -webkit-text-stroke:calc(var(--u) * 5) var(--ink); paint-order:stroke fill; }
    .msg-main { min-width:0; }
    .msg-head { display:flex; gap:calc(var(--u) * 12); align-items:baseline; }
    .msg-head strong { color:var(--star); font-weight:normal; font-size:max(13px, calc(var(--u) * 24)); }
    .msg-head time { color:#b79a73; font-size:max(10px, calc(var(--u) * 18)); }
    .msg p { margin:calc(var(--u) * 4) 0 0; font-size:max(14px, calc(var(--u) * 27)); line-height:1.3; overflow-wrap:anywhere; }
    .composer { display:grid; grid-template-columns:1fr auto; gap:calc(var(--u) * 12); }
    .composer input { min-width:0; background:var(--dark); color:#fff; border:calc(var(--u) * 4) solid #8b623a; padding:0 calc(var(--u) * 18); height:calc(var(--u) * 76); font:inherit; font-size:max(16px, calc(var(--u) * 27)); }
    .chat .hint { min-height:1.2em; }

    /* Polls: "Ask the Audience". Lettered wood buttons, percentages revealed when voting ends. */
    .poll-options { display:grid; gap:calc(var(--u) * 14); }
    .poll-option { position:relative; display:grid; grid-template-columns:calc(var(--u) * 64) 1fr auto; align-items:center; gap:0 calc(var(--u) * 16); width:100%; text-align:left; background:var(--wood); border:calc(var(--u) * 4) solid #f3d29a; padding:calc(var(--u) * 12) calc(var(--u) * 18); min-height:calc(var(--u) * 96); }
    .poll-option:active:not(:disabled) { transform:scale(.98); }
    .poll-option:disabled { cursor:default; }
    .poll-option img { width:calc(var(--u) * 64); height:calc(var(--u) * 64); grid-row:1; }
    .poll-option .option-copy, .poll-option .vote-count { font-size:max(14px, calc(var(--u) * 28)); -webkit-text-stroke:calc(var(--u) * 5) var(--ink); paint-order:stroke fill; text-transform:uppercase; }
    .poll-option .vote-count { color:var(--star); }
    .poll-option .bar { grid-column:2 / 4; height:calc(var(--u) * 16); background:var(--dark); margin-top:calc(var(--u) * 8); position:relative; }
    .poll-option .bar i { position:absolute; left:0; top:0; bottom:0; width:calc(var(--pct, 0) * 1%); background:#b98a3c; }
    .poll-option.winner { border-color:#ffd45e; }
    .poll-option.winner .bar i { background:#ffd45e; }
    .poll-option.chosen { border-color:var(--cyan); }

    /* Menu (settings): room facts and who is connected. */
    .roster { display:grid; gap:calc(var(--u) * 10); background:var(--dark); border:calc(var(--u) * 4) solid #8b623a; padding:calc(var(--u) * 16); }
    .roster-row { display:flex; justify-content:space-between; gap:calc(var(--u) * 12); font-size:max(13px, calc(var(--u) * 24)); color:var(--cream); }
    .roster-row .state { color:#b79a73; }
    .roster-row .state.on { color:var(--star); }
    @media (prefers-reduced-motion:reduce) { .tile { transition:none; } }
  </style>
</head>
<body>

<!-- ======================= LIVE GAMES (room list) ======================= -->
<main id="directoryView" class="dir">
  <header class="dir-head">
    <img class="shadow" src="assets/backgrounds/header%20shadow.webp" alt="">
    <img class="plank" src="assets/backgrounds/header%20%20plank%201.webp" alt="">
    <img class="logo" src="assets/ui/shapey%20icon.webp" alt="Shapey">
    <h1 class="gt" style="--fs:54;--st:11">LIVE GAMES</h1>
  </header>

  <div id="modeChips" class="filter-row" role="group" aria-label="Filter by mode">
    <button type="button" class="wood is-active" data-mode="all" aria-pressed="true">ALL</button>
    <button type="button" class="wood" data-mode="tag" aria-pressed="false">TAG: 2 VS 2</button>
    <button type="button" class="wood" data-mode="pvp" aria-pressed="false">PLAYER 1 VS PLAYER 2</button>
  </div>
  <div id="statusChips" class="filter-row" role="group" aria-label="Filter by status">
    <button type="button" class="wood is-active" data-status="live" aria-pressed="true">LIVE</button>
    <button type="button" class="wood" data-status="waiting" aria-pressed="false">WAITING</button>
    <button type="button" class="wood" data-status="all" aria-pressed="false">ALL ROOMS</button>
  </div>
  <p id="directoryStatus" class="dir-status" role="status" aria-live="polite">Loading live games…</p>
  <div id="roomCards" class="room-list" aria-live="polite"></div>

  <nav class="dir-nav">
    <img src="assets/backgrounds/bottom%20navigation.webp" alt="">
    <a class="wood home" href="staging/">GAME HOME</a>
    <button id="refreshRooms" type="button" class="wood refresh">REFRESH</button>
  </nav>
</main>

<!-- ============================ WATCH A ROOM ============================ -->
<main id="watchView" class="stage" hidden>
  <div class="canvas">
    <img class="fill" style="top:0;height:100%" src="assets/backgrounds/BG.webp" alt="" draggable="false">
    <img class="fill" style="top:0" src="assets/backgrounds/header%20shadow.webp" alt="" draggable="false">
    <img class="fill" style="top:0" src="assets/backgrounds/header%20%20plank%201.webp" alt="" draggable="false">

    <div id="side0" class="team">
      <img style="--x:105;--y:20;--w:186.24;--h:147.36" src="assets/ui/player%20plank.webp" alt="" draggable="false">
      <span id="p1Score" class="at c gt" style="--x:107;--y:71.5;--fs:46;--st:10">0</span>
      <span id="p1Name" class="at c gt" style="--x:101;--y:142;--fs:21;--st:5">Player 1</span>
    </div>
    <div id="side1" class="team">
      <img style="--x:612;--y:20;--w:197.76;--h:160.56" src="assets/ui/player%20plank%202.webp" alt="" draggable="false">
      <span id="p2Score" class="at c gt" style="--x:608;--y:76.2;--fs:46;--st:10">0</span>
      <span id="p2Name" class="at c gt" style="--x:608;--y:153.3;--fs:21;--st:5">Player 2</span>
    </div>
    <img class="at c" style="--x:360;--y:101;--w:262" src="assets/ui/timer%20plank.webp" alt="" draggable="false">
    <span id="turnClock" class="at c gt" style="--x:384;--y:103;--fs:46;--st:10" role="timer" aria-label="Turn clock">--:--</span>
    <span id="goalText" class="at c gt" style="--x:360;--y:166;--fs:21;--st:5" hidden></span>
    <span id="revealText" class="at c gt" style="--x:360;--y:190;--fs:26;--st:6"></span>
    <div id="toast" class="at c gt" style="--x:360;--y:256;--fs:24;--st:5" role="status" aria-live="polite" hidden></div>

    <img class="fill" style="top:0;height:100%" src="assets/backgrounds/Tray%20Shadow.webp" alt="" draggable="false">
    <img class="fill" style="top:calc(var(--u) * 284)" src="assets/backgrounds/tray.webp" alt="" draggable="false">
    <div id="board" role="img" aria-label="Game board, read-only"></div>
    <div id="veil" class="veil">
      <p id="veilText" class="gt" style="--fs:30;--st:7">Connecting…</p>
      <button id="retryConnection" type="button" class="wood" style="--fs:32" hidden>RETRY</button>
    </div>

    <img class="fill" style="bottom:0" src="assets/backgrounds/bottom%20navigation.webp" alt="" draggable="false">
    <button id="btnChat" class="nav-icon" style="--x:175" aria-label="Chat" aria-expanded="false"><img src="assets/ui/chat.webp" alt=""><span id="chatBadge" class="badge" hidden>0</span></button>
    <button id="btnPolls" class="nav-icon" style="--x:360" aria-label="Polls" aria-expanded="false"><img src="assets/ui/polls.webp" alt=""><span id="pollBadge" class="badge" hidden>!</span></button>
    <button id="btnSettings" class="nav-icon" style="--x:545" aria-label="Settings" aria-expanded="false"><img src="assets/ui/settings.webp" alt=""></button>

    <div id="backdrop" class="backdrop" hidden></div>

    <section id="chatPanel" class="sheet chat" role="dialog" aria-label="Chat" hidden>
      <header class="sheet-head">
        <h2 class="gt" style="--fs:42;--st:9">CHAT</h2>
        <span id="chatCount" class="sub"></span>
        <button id="closeChat" type="button" class="wood x" aria-label="Close chat">X</button>
      </header>
      <div id="chatMessages" class="msgs" role="log" aria-live="polite"></div>
      <p id="chatStatus" class="sub hint"></p>
      <form id="chatForm" class="composer" autocomplete="off">
        <input id="chatInput" maxlength="280" placeholder="Say something…" aria-label="Message">
        <button id="sendChat" type="submit" class="wood">SEND</button>
      </form>
    </section>

    <section id="pollPanel" class="sheet poll" role="dialog" aria-label="Ask the audience" hidden>
      <header class="sheet-head">
        <h2 class="gt" style="--fs:40;--st:9">ASK THE AUDIENCE</h2>
        <button id="closePoll" type="button" class="wood x" aria-label="Close polls">X</button>
      </header>
      <p id="pollIntro" class="sub"></p>
      <div id="pollOptions" class="poll-options"></div>
    </section>

    <section id="settingsPanel" class="sheet menu" role="dialog" aria-label="Menu" hidden>
      <header class="sheet-head">
        <h2 class="gt" style="--fs:48;--st:10">MENU</h2>
        <button id="closeSettings" type="button" class="wood x" aria-label="Close menu">X</button>
      </header>
      <p id="roomSummary" class="sub"></p>
      <div id="playersList" class="roster"></div>
      <button id="resumeWatch" type="button" class="wood" style="--fs:34">RESUME</button>
      <button id="shareRoom" type="button" class="wood" style="--fs:30">COPY WATCH LINK</button>
      <button id="backToDirectory" type="button" class="wood" style="--fs:30">ALL LIVE GAMES</button>
    </section>
  </div>
</main>

<script src="staging/audience.js"></script>
</body>
</html>
