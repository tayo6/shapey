<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shapey</title>
  <!-- Start the slow third-party connection and the font download as early as possible. -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preload" href="assets/fonts/HAPPY%20SCHOOL.TTF" as="font" type="font/ttf" crossorigin />
  <style>
    @font-face {
      font-family: 'HappySchool';
      src: url('assets/fonts/HAPPY%20SCHOOL.TTF') format('truetype');
    }
    html, body { margin: 0; height: 100%; background: #2b1a0f; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    /* Shown instantly, while Phaser itself is still downloading; the game replaces it with its own loading bar. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff2c7; font: bold 12vmin sans-serif; text-shadow: 0 0 6px #4a2814, 0 0 6px #4a2814;
    }
    #boot small { font-size: 4vmin; margin-top: 2vmin; opacity: .8; }
  </style>
</head>
<body>
  <div id="boot">SHAPEY<small>Loading…</small></div>
  <div id="game"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
