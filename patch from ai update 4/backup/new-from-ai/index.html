<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shapey</title>
  <link rel="icon" type="image/webp" href="assets/ui/shapey%20icon.webp" />
  <!-- Start the slow third-party connection, the font and the three boot-screen images as early as possible. -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preload" href="assets/fonts/HAPPY%20SCHOOL.TTF" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="assets/backgrounds/BG.webp" as="image" type="image/webp" />
  <link rel="preload" href="assets/ui/shapey%20logo.webp" as="image" type="image/webp" />
  <link rel="preload" href="assets/ui/load%20rectangle.jpeg" as="image" type="image/jpeg" />
  <style>
    @font-face {
      font-family: 'HappySchool';
      src: url('assets/fonts/HAPPY%20SCHOOL.TTF') format('truetype');
    }
    html, body { margin: 0; height: 100%; background: #2b1a0f; overflow: hidden; }
    #game { width: 100%; height: 100%; }

    /* Shown while Phaser itself is still downloading. It uses the same layout as the in-game loading screen
       (a 720 x 1280 stage: background fills it, logo centred at 470, load bar centred at 720), so the hand-over
       is seamless. Keep these numbers in sync with LOGO_* / LOAD_BAR_* / LOAD_TRACK in src/constants.js.
       The stage stays hidden until src/loading-bar.js has the background, the logo and the plank ready, then
       #boot gets the "ready" class and all three appear in the same frame. The animation on .stage is only a
       safety net: if the script never runs, the stage is shown after 6.5 seconds anyway. */
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #boot .stage {
      position: relative; width: min(100vw, 56.25vh); height: min(177.78vw, 100vh);
      visibility: hidden;
      animation: bootSafetyReveal 0s linear 6.5s forwards;
    }
    #boot.ready .stage { visibility: visible; animation: none; }
    #boot img { position: absolute; left: 50%; transform: translate(-50%, -50%); height: auto; }
    #boot .bg { left: 0; top: 0; width: 100%; height: 100%; transform: none; }
    #boot .logo { top: 36.72%; width: 72.22%; } /* 520 / 720, 470 / 1280 */
    #boot.ready .logo { animation: logoFloat 900ms ease-in-out infinite alternate; }
    #boot .bar { position: absolute; left: 50%; top: 56.25%; width: 77.78%; transform: translate(-50%, -50%); } /* 560 / 720, 720 / 1280 */
    #boot .bar canvas { display: block; width: 100%; height: auto; }
    #boot .fill {
      position: absolute; left: 6.637%; top: 28.302%; height: 42.925%; width: 5.197%;
      background: #f2b84b;
    }
    #boot.ready .fill { animation: pulse 500ms ease-in-out infinite alternate; }
    #boot .gloss {
      position: absolute; top: 0; left: 0; width: 100%; height: 45%;
      background: #ffe3a0; opacity: .7; /* same as the gloss in LoadScene */
    }
    @keyframes bootSafetyReveal { to { visibility: visible; } }
    @keyframes pulse { from { opacity: .75; } to { opacity: 1; } }
    @keyframes logoFloat {
      from { transform: translate(-50%, -50%) translateY(0); }
      to { transform: translate(-50%, -50%) translateY(-3.846%); }
    }
  </style>
</head>
<body>
  <div id="boot"><div class="stage">
    <img class="bg" src="assets/backgrounds/BG.webp" alt="" width="720" height="1280" />
    <img class="logo" src="assets/ui/shapey%20logo.webp" alt="Shapey" width="1100" height="440" />
    <div class="bar"><canvas id="bootLoadRectangle" width="840" height="175"></canvas><div class="fill"><div class="gloss"></div></div></div>
  </div></div>
  <div id="game"></div>
  <!-- Classic scripts run first: boot screen, Phaser, then the UMD rule/meme globals.
       The ES-module entry runs after them (modules are deferred), so window.ShapeyRules,
       window.ShapeyMemes and window.ShapeyLoadingBar already exist when it evaluates. -->
  <script src="src/loading-bar.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="src/rules.js"></script>
  <script src="src/memes.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
