name: Validate staging audience preview

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - staging/audience-room-ui-0003
  pull_request:
    branches:
      - main
    paths:
      - staging/audience.html
      - staging/audience.js
      - staging/audience/**
      - staging/index.html
      - staging/*.js
      - src/**
      - assets/**
      - worker/src/**
      - tests/rules.test.js
      - tests/test-overrides.test.mjs
      - tools/build-pages-artifact.sh
      - .github/workflows/pages.yml
      - .github/workflows/staging-preview.yml

jobs:
  check:
    name: Test staging page and Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run game-rule and test-override tests
        run: node --test tests/rules.test.js tests/test-overrides.test.mjs

      - name: Check JavaScript syntax
        run: |
          set -e
          for f in src/*.js src/scenes/*.js staging/audience/*.js worker/src/index.js; do
            node --check "$f"
          done

      - name: Build and validate the Pages artifact
        run: bash tools/build-pages-artifact.sh

      - name: Smoke-test the candidate staging page and assets locally
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/shapey-static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          base="http://127.0.0.1:4173"

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$base/staging/audience.html" -o /tmp/audience.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/audience.html
          grep -q 'id="gameFrame"' /tmp/audience.html
          grep -q 'id="startDemo"' /tmp/audience.html

          # The audience page is an ES-module app now: check its entry and key modules.
          curl --fail --silent --show-error "$base/staging/audience/main.js" -o /tmp/audience-main.js
          curl --fail --silent --show-error "$base/staging/audience/watch.js" -o /tmp/audience-watch.js
          curl --fail --silent --show-error "$base/staging/audience/board.js" -o /tmp/audience-board.js
          curl --fail --silent --show-error "$base/staging/audience/state.js" -o /tmp/audience-state.js
          grep -q 'startAiDemo' /tmp/audience-main.js
          grep -q 'function startAiDemo()' /tmp/audience-watch.js
          grep -q "type: 'poll_vote', tileId" /tmp/audience-board.js
          # Worker URLs live in the shared resolver: production and staging pages choose by environment.
          curl --fail --silent --show-error "$base/src/game/api-environment.js" -o /tmp/api-environment.js
          grep -Fq "https://shapey-multiplayer.hellohuman100.workers.dev" /tmp/api-environment.js
          grep -Fq "https://shapey-multiplayer-staging.hellohuman100.workers.dev" /tmp/api-environment.js

          curl --fail --silent --show-error "$base/src/scenes/load.js" -o /tmp/load-scene.js
          grep -q 'AUDIENCE_WATCH_CODE' /tmp/load-scene.js
          grep -q "searchParams.set('env', 'staging')" /tmp/load-scene.js
          curl --fail --silent --show-error "$base/src/config.js" -o /tmp/config.js
          grep -q 'resolveMultiplayerApi' /tmp/config.js
          curl --fail --silent --show-error "$base/src/rules.js" -o /tmp/rules.js
          grep -q 'ShapeyRules' /tmp/rules.js

          for asset in \
            "assets/backgrounds/BG.webp" \
            "assets/backgrounds/header%20%20plank%201.webp" \
            "assets/backgrounds/bottom%20navigation.webp" \
            "assets/backgrounds/Tray%20Shadow.webp" \
            "assets/backgrounds/tray.webp" \
            "assets/fonts/HAPPY%20SCHOOL.TTF" \
            "assets/ui/shapey%20icon.webp" \
            "assets/ui/shapey%20logo.webp" \
            "assets/ui/load%20rectangle.jpeg" \
            "assets/ui/chat.webp" \
            "assets/ui/polls.webp" \
            "assets/ui/settings.webp" \
            "assets/ui/player%20plank.webp" \
            "assets/ui/player%20plank%202.webp" \
            "assets/ui/timer%20plank.webp" \
            "assets/shapes/circle.webp"; do
            curl --fail --silent --show-error "$base/$asset" -o /dev/null
          done
          echo "Candidate audience page, shared game modules, and artwork assets are reachable."

      - name: Check the hosted static preview (informational)
        env:
          PREVIEW_URL: https://shapey-audience-preview.hellohuman100.workers.dev/staging/audience.html
        run: |
          base="${PREVIEW_URL%/staging/audience.html}"
          if curl --fail --silent --max-time 15 -D /tmp/preview-headers "$PREVIEW_URL" -o /tmp/preview-audience.html &&
             grep -Fqi 'x-shapey-preview: static-only-0005' /tmp/preview-headers &&
             grep -q 'id="gameFrame"' /tmp/preview-audience.html &&
             curl --fail --silent --max-time 15 "$base/src/scenes/load.js" -o /dev/null &&
             curl --fail --silent --max-time 15 "$base/src/config.js" -o /dev/null; then
            echo "Hosted preview is reachable and serves the shared game modules."
          else
            echo "::warning title=Hosted static preview unavailable::The separate Cloudflare-hosted audience preview is not serving the expected current page/modules. The candidate files are tested locally in this workflow, and the staging Worker is checked below. Restore or redeploy this preview to re-enable the external-page check."
          fi

      - name: Ensure the hosted preview is not a backend relay
        run: |
          set -euo pipefail
          preview_base="https://shapey-audience-preview.hellohuman100.workers.dev"
          api_status="$(curl --silent --show-error --max-time 15 -o /tmp/preview-api.json -w '%{http_code}' "$preview_base/api/rooms")"
          echo "Preview API status (must be retired): $api_status"
          test "$api_status" = 410
          grep -q 'static files only' /tmp/preview-api.json
          ws_status="$(curl --silent --show-error --max-time 15 -o /tmp/preview-ws.json -w '%{http_code}' "$preview_base/ws/ABC234")"
          echo "Preview WebSocket status (must be retired): $ws_status"
          test "$ws_status" = 410
          echo "Preview serves static files only; multiplayer traffic cannot relay through it."

      - name: Check the deployed staging Worker directly
        run: |
          set -euo pipefail
          direct_status="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 -o /tmp/direct-health.json -w '%{http_code}' 'https://shapey-multiplayer-staging.hellohuman100.workers.dev/health')"
          echo "Direct staging Worker health status: $direct_status"
          cat /tmp/direct-health.json
          test "$direct_status" = 200
          grep -q '"stage":"authoritative-gameplay-v1"' /tmp/direct-health.json
          grep -q '"audiencePollSeconds":30' /tmp/direct-health.json
          grep -q '"pollResultsHiddenUntilClose":true' /tmp/direct-health.json

          backend_rooms_status="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 -H 'Origin: https://shapey-audience-preview.hellohuman100.workers.dev' -o /tmp/backend-rooms.json -w '%{http_code}' 'https://shapey-multiplayer-staging.hellohuman100.workers.dev/api/rooms')"
          echo "Direct staging room-directory status: $backend_rooms_status"
          cat /tmp/backend-rooms.json
          test "$backend_rooms_status" = 200
          grep -q '"rooms":' /tmp/backend-rooms.json

          # The same PR now routes the live game to production, so verify its deployed API too.
          production_status="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 -o /tmp/production-health.json -w '%{http_code}' 'https://shapey-multiplayer.hellohuman100.workers.dev/health')"
          echo "Direct production Worker health status: $production_status"
          cat /tmp/production-health.json
          test "$production_status" = 200
          grep -q '"stage":"authoritative-gameplay-v1"' /tmp/production-health.json
          grep -q '"audiencePollSeconds":30' /tmp/production-health.json
          grep -q '"pollResultsHiddenUntilClose":true' /tmp/production-health.json

          production_rooms_status="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 -H 'Origin: https://tayo6.github.io' -o /tmp/production-rooms.json -w '%{http_code}' 'https://shapey-multiplayer.hellohuman100.workers.dev/api/rooms')"
          echo "Direct production room-directory status: $production_rooms_status"
          cat /tmp/production-rooms.json
          test "$production_rooms_status" = 200
          grep -q '"rooms":' /tmp/production-rooms.json
