name: Validate staging audience preview

on:
  push:
    branches:
      - staging/audience-room-ui-0003
  pull_request:
    branches:
      - main
    paths:
      - staging/audience.html
      - staging/audience.js
      - src/rules.js
      - .github/workflows/staging-preview.yml

permissions:
  contents: read

jobs:
  check:
    name: Test candidate without publishing to main
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run game-rule tests
        run: node --test tests/rules.test.js

      - name: Check JavaScript syntax
        run: |
          set -e
          for f in src/*.js src/scenes/*.js staging/audience.js worker/src/index.js; do
            node --check "$f"
          done

      - name: Smoke-test the deployed preview
        env:
          PREVIEW_URL: https://shapey-audience-preview.hellohuman100.workers.dev/staging/audience.html
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/staging/audience.html}"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 -D /tmp/preview-headers "$PREVIEW_URL" -o /tmp/audience.html
          grep -Fqi 'x-shapey-preview: 0003+0004' /tmp/preview-headers
          grep -q 'id="gameFrame"' /tmp/audience.html
          grep -q 'id="startDemo"' /tmp/audience.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$base/staging/audience.js" -o /tmp/audience.js
          grep -q 'function startAiDemo()' /tmp/audience.js
          grep -q "type: 'poll_vote', tileId" /tmp/audience.js
          # The game page now loads the shared ES modules from src/ (staging/ has no forked copy).
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$base/src/scenes/load.js" -o /tmp/load-scene.js
          grep -q 'AUDIENCE_WATCH_CODE' /tmp/load-scene.js
          # The exact game-poll label is presentation copy and has changed over time; AUDIENCE_WATCH_CODE above verifies the relevant staging client path.
          direct_status="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 -o /tmp/direct-health.json -w '%{http_code}' 'https://shapey-multiplayer-staging.hellohuman100.workers.dev/health')"
          echo "Direct staging Worker health status: $direct_status"
          cat /tmp/direct-health.json
          proxy_status="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 -o /tmp/staging-health.json -w '%{http_code}' "$base/health")"
          echo "Preview-proxied staging Worker health status: $proxy_status"
          cat /tmp/staging-health.json
          test "$direct_status" = 200
          test "$proxy_status" = 200
          grep -q '"stage":"authoritative-gameplay-v1"' /tmp/staging-health.json
          grep -q '"audiencePollSeconds":30' /tmp/staging-health.json
          grep -q '"pollResultsHiddenUntilClose":true' /tmp/staging-health.json
          # Test the exact audience directory endpoint through both public entry points. The preview's /health is static,
          # so it cannot substitute for checking a real GET /api/rooms response.
          backend_rooms_status="$(curl --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 -H 'Origin: https://shapey-audience-preview.hellohuman100.workers.dev' -o /tmp/backend-rooms.json -w '%{http_code}' 'https://shapey-multiplayer-staging.hellohuman100.workers.dev/api/rooms')"
          echo "Direct staging room-directory status: $backend_rooms_status"
          cat /tmp/backend-rooms.json
          test "$backend_rooms_status" = 200
          grep -q '"rooms":' /tmp/backend-rooms.json
          grep -Fq "https://shapey-multiplayer-staging.hellohuman100.workers.dev" /tmp/audience.js
          # The Worker URL now lives in src/config.js (staging/main.js no longer exists).
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$base/src/config.js" -o /tmp/config.js
          grep -Fq "https://shapey-multiplayer-staging.hellohuman100.workers.dev" /tmp/config.js
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$base/src/rules.js" -o /tmp/rules.js
          grep -q 'ShapeyRules' /tmp/rules.js
          # Check assets through the exact preview URL used by the phone, not only on GitHub Pages.
          assets_base="$base"
          for asset in \
            "assets/backgrounds/BG.webp" \
            "assets/backgrounds/header%20%20plank%201.webp" \
            "assets/backgrounds/bottom%20navigation.webp" \
            "assets/backgrounds/Tray%20Shadow.webp" \
            "assets/backgrounds/tray.webp" \
            "assets/fonts/HAPPY%20SCHOOL.TTF" \
            "assets/ui/shapey%20icon.webp" \
            "assets/ui/shapey%20logo.webp" \
            "assets/ui/load%20rectangle.jpeg" \
            "assets/ui/chat.webp" \
            "assets/ui/polls.webp" \
            "assets/ui/settings.webp" \
            "assets/ui/player%20plank.webp" \
            "assets/ui/player%20plank%202.webp" \
            "assets/ui/timer%20plank.webp" \
            "assets/shapes/circle.webp"; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 "$assets_base/$asset" -o /dev/null
          done
          echo "Preview page, demo scripts, rule script, and Shapey artwork assets are reachable."
