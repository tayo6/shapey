name: Deploy Shapey to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test extracted game rules
        run: node --test tests/

      - name: Check game and staging JavaScript syntax (all ES modules)
        run: |
          set -e
          for f in src/*.js src/scenes/*.js staging/audience.js; do
            node --check "$f"
          done

      - name: Check the meme manifest lists every meme file
        run: node tools/build-memes-manifest.js --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
