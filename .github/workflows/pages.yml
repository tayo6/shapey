name: Deploy Shapey to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test game rules and extracted modules
        run: node --test tests/*.test.js tests/*.test.mjs

      - name: Check game and staging JavaScript syntax (all ES modules)
        run: |
          set -e
          for f in src/*.js src/scenes/*.js src/game/*.js staging/audience/*.js; do
            node --check "$f"
          done

      - name: Check the meme manifest lists every meme file
        run: node tools/build-memes-manifest.js --check

      - name: Build minimal Pages artifact
        run: bash tools/build-pages-artifact.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
