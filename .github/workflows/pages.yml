name: Deploy Shapey to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test extracted game rules
        run: node --test tests/rules.test.js tests/memes.test.js

      - name: Check game JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/rules.js
          node --check src/loading-bar.js
          node --check src/memes.js

      - name: Check staging UI JavaScript syntax
        run: |
          node --check staging/main.js
          node --check staging/memes.js
          node --check staging/audience.js

      - name: Check the meme manifest lists every meme file
        run: node tools/build-memes-manifest.js --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
