name: Local gameplay regression tests

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "staging/index.html"
      - "staging/audience.js"
      - "tools/build-memes-manifest.js"
      - "assets/memes/**"
      - "tests/**"
      - ".github/workflows/local-gameplay-tests.yml"

permissions:
  contents: read

jobs:
  local-gameplay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run pure-rule and module unit tests (rules, memes, utils, board, trackers, AI)
        run: node --test tests/

      - name: Check every frontend and tool module's syntax (ES modules included)
        run: |
          set -e
          for f in src/*.js src/scenes/*.js staging/audience.js tools/build-memes-manifest.js; do
            echo "-- $f"
            node --check "$f"
          done

      - name: Check the meme manifest lists every meme file
        run: node tools/build-memes-manifest.js --check
