name: Multiplayer Worker tests

on:
  push:
    branches:
      - main
      - staging/audience-room-ui-0003
    paths:
      - "worker/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/worker-tests.yml"
      - "staging/audience.js"
      - "staging/audience/**"
      - "staging/index.html"
  pull_request:
    paths:
      - "worker/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/worker-tests.yml"
      - "staging/audience.html"
      - "staging/audience.js"
      - "staging/audience/**"
      - "staging/index.html"
      - ".github/workflows/staging-preview.yml"
jobs:
  worker-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install integration test dependency
        run: npm install --no-audit --no-fund

      - name: Install Chromium for browser smoke tests
        run: npx playwright install chromium

      - name: Validate Worker bundle and Wrangler config without deploying
        run: |
          # Local browser tests originate from localhost, so use the staging allow-list.
          CONFIG=wrangler.staging.jsonc
          npx --yes wrangler@4.151.0 deploy --config "$CONFIG" --dry-run --outdir /tmp/shapey-worker-dry-run
      - name: Run protocol and game-engine tests
        run: npm test

      # Start one local Worker and keep it alive for both integration suites. Starting a second
      # Wrangler process on the same port left a child process behind on GitHub's Linux runner.
      - name: Run local Worker integration and browser tests (no deployment)
        run: |
          # Local browser tests originate from localhost, so use the staging allow-list.
          CONFIG=wrangler.staging.jsonc
          setsid npx --yes wrangler@4.151.0 dev --config "$CONFIG" --local --ip 127.0.0.1 --port 8787 > /tmp/shapey-local-worker.log 2>&1 &
          WORKER_PID=$!
          setsid python3 -m http.server 8080 --bind 127.0.0.1 --directory .. > /tmp/shapey-local-pages.log 2>&1 &
          PAGES_PID=$!
          cleanup() {
            kill -- "-$WORKER_PID" 2>/dev/null || true
            kill -- "-$PAGES_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8787/health | grep -q 'authoritative-gameplay-v1' &&
               curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" != "1" ]; then
            echo "---- Local Worker log ----"
            cat /tmp/shapey-local-worker.log
            echo "---- Static Pages log ----"
            cat /tmp/shapey-local-pages.log
            exit 1
          fi

          node integration-smoke.mjs || {
            echo "---- Local Worker log after integration failure ----"
            cat /tmp/shapey-local-worker.log
            exit 1
          }
          node browser-smoke.mjs || {
            echo "---- Local Worker log after PvP browser failure ----"
            cat /tmp/shapey-local-worker.log
            echo "---- Static Pages log after PvP browser failure ----"
            cat /tmp/shapey-local-pages.log
            exit 1
          }
          node tag-browser-smoke.mjs || {
            echo "---- Local Worker log after Tag browser failure ----"
            cat /tmp/shapey-local-worker.log
            echo "---- Static Pages log after Tag browser failure ----"
            cat /tmp/shapey-local-pages.log
            exit 1
          }

      - name: Validate Wrangler JSON syntax
        run: node -e 'for (const f of ["wrangler.jsonc", "wrangler.staging.jsonc"]) { JSON.parse(require("node:fs").readFileSync(f, "utf8")); console.log(f + " is valid JSON"); }'
      - name: Run local turn-rule regression tests
        working-directory: .
        run: node --test tests/turn-rules.test.js

      - name: Run existing pure game-rule tests
        working-directory: .
        run: node --test tests/rules.test.js

      - name: Check frontend JavaScript syntax
        working-directory: .
        run: |
          set -e
          for f in src/*.js src/scenes/*.js staging/audience/*.js; do
            node --check "$f"
          done

  # The clock-skew and audience smokes are a separate job with their own local Worker: the
  # Worker rate-limits room creation (5 rooms per 10 minutes per client, one shared bucket for
  # a local wrangler dev), and the integration/browser/tag smokes above already create exactly
  # five rooms between them. A second job gets its own ephemeral Worker state and bucket.
  worker-clock-and-audience-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install integration test dependency
        run: npm install --no-audit --no-fund

      - name: Warm pinned Wrangler CLI
        run: npx --yes wrangler@4.151.0 --version

      - name: Install Chromium for browser smoke tests
        run: npx playwright install chromium

      - name: Run local Worker clock-skew and audience tests (no deployment)
        run: |
          # Local browser tests originate from localhost, so use the staging allow-list.
          CONFIG=wrangler.staging.jsonc
          setsid npx --yes wrangler@4.151.0 dev --config "$CONFIG" --local --ip 127.0.0.1 --port 8787 > /tmp/shapey-local-worker.log 2>&1 &
          WORKER_PID=$!
          setsid python3 -m http.server 8080 --bind 127.0.0.1 --directory .. > /tmp/shapey-local-pages.log 2>&1 &
          PAGES_PID=$!
          cleanup() {
            kill -- "-$WORKER_PID" 2>/dev/null || true
            kill -- "-$PAGES_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8787/health | grep -q 'authoritative-gameplay-v1' &&
               curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" != "1" ]; then
            echo "---- Local Worker log ----"
            cat /tmp/shapey-local-worker.log
            echo "---- Static Pages log ----"
            cat /tmp/shapey-local-pages.log
            exit 1
          fi

          node clock-skew-smoke.mjs || {
            echo "---- Local Worker log after clock-skew browser failure ----"
            cat /tmp/shapey-local-worker.log
            echo "---- Static Pages log after clock-skew browser failure ----"
            cat /tmp/shapey-local-pages.log
            exit 1
          }
          node audience-smoke.mjs || {
            echo "---- Local Worker log after audience browser failure ----"
            cat /tmp/shapey-local-worker.log
            echo "---- Static Pages log after audience browser failure ----"
            cat /tmp/shapey-local-pages.log
            exit 1
          }
