name: Multiplayer Worker tests

on:
  pull_request:
    paths:
      - "worker/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/worker-tests.yml"
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/worker-tests.yml"

jobs:
  worker-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install integration test dependency
        run: npm install --no-audit --no-fund

      - name: Validate Worker bundle and Wrangler config without deploying
        run: npx --yes wrangler@4.151.0 deploy --dry-run --outdir /tmp/shapey-worker-dry-run
      - name: Run protocol tests
        run: npm test

      - name: Run local Worker integration tests (no deployment)
        run: |
          npx --yes wrangler@4.151.0 dev --local --ip 127.0.0.1 --port 8787 > /tmp/shapey-local-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          node integration-smoke.mjs || {
            echo "---- Local Wrangler Worker log ----"
            cat /tmp/shapey-local-worker.log
            exit 1
          }
      - name: Validate Wrangler JSON syntax
        run: node -e 'JSON.parse(require("node:fs").readFileSync("wrangler.jsonc", "utf8")); console.log("wrangler.jsonc is valid JSON")'
      - name: Run local turn-rule regression tests
        working-directory: .
        run: node --test tests/turn-rules.test.js

      - name: Run existing pure game-rule tests
        working-directory: .
        run: node --test tests/rules.test.js

      - name: Check frontend JavaScript syntax
        working-directory: .
        run: node --check src/main.js
